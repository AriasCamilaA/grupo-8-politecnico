<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista Tareas</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100 font-sans flex h-screen">

    <div class="w-64 bg-white border-r border-gray-200 flex flex-col justify-between p-4">
        <div>
            <div class="text-emerald-600 font-bold text-2xl flex items-center gap-2 mb-8">
                <span>✓</span> Lista de Tareas Poli
            </div>
            <nav class="space-y-2">
                <a href="#"
                    class="flex justify-between items-center bg-emerald-50 text-emerald-700 p-2 rounded-lg font-medium">
                    <span>🗒️ Tareas Pendientes</span>
                    <span id="sidebar-count"
                        class="bg-emerald-200 text-emerald-800 text-xs px-2 py-0.5 rounded-full">0</span>
                </a>
            </nav>
        </div>
        <div class="text-gray-400 text-sm p-2 bg-gray-50 rounded text-center border border-gray-200">
        </div>
    </div>
    <div class="flex-1 flex flex-col">
        <header class="bg-emerald-700 text-white p-4 flex justify-between items-center shadow-md">
            <h1 class="text-xl font-semibold flex items-center gap-2">🗒️ Tareas Pendientes</h1>
            <div class="flex items-center gap-2">
                <span class="text-sm opacity-90">Bienvenido!!</span>
            </div>
        </header>
        <div class="flex-1 p-6 flex gap-6 overflow-y-auto">
            <div class="flex-1 bg-white p-6 rounded-xl shadow-sm border border-gray-200 flex flex-col">
                <form id="task-form" class="flex gap-2 mb-6">
                    <input type="text" id="task-input" placeholder="+ Agregar una tarea..." required
                        class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:border-emerald-500 text-gray-700">
                    <button type="submit"
                        class="bg-emerald-600 text-white px-4 py-2 rounded-lg hover:bg-emerald-700 transition">
                        Añadir
                    </button>
                </form>
                <ul id="task-list" class="space-y-3 flex-1 overflow-y-auto">
                </ul>
            </div>
            <div class="w-80 space-y-6">
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200">
                    <h3 class="font-bold text-gray-700 mb-3 flex items-center gap-2">📋 Resumen</h3>
                    <div class="grid grid-cols-2 gap-2 text-center">
                        <div class="bg-blue-50 p-3 rounded-lg border border-blue-100">
                            <span id="stats-pending" class="block text-2xl font-bold text-blue-600">0</span>
                            <span class="text-xs text-gray-500">Pendientes</span>
                        </div>
                        <div class="bg-emerald-50 p-3 rounded-lg border border-emerald-100">
                            <span id="stats-completed" class="block text-2xl font-bold text-emerald-600">0</span>
                            <span class="text-xs text-gray-500">Completadas</span>
                        </div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 text-center">
                    <h3 class="font-bold text-gray-700 mb-2 text-left">📈 Progreso</h3>
                    <div class="text-3xl font-bold text-emerald-600 my-2" id="progress-text">0%</div>
                    <p class="text-xs text-gray-500" id="progress-desc">¡Empieza a organizar tu día!</p>
                </div>
            </div>

        </div>
    </div>

    <script src="js/tasks.js"></script>
    <script src="js/ui.js"></script>
</body>

</html>
